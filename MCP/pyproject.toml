[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-agent-mcp"
version = "0.1.0"
description = "MCP server for Unity Agent that uses LLM to decide agent actions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0,<1.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "httpx>=0.26.0",
]

[project.scripts]
unity-agent-mcp = "unity_agent_mcp.server:main"
unity-agent-mcp-http = "unity_agent_mcp.http_server:run_http_server"
